# Builds the SY-1 plugin (AU + VST3 + Standalone for macOS, VST3 + Standalone for Windows).
# Download the builds from the run's "Artifacts" (Actions tab → this workflow → latest run).
name: plugin

on:
  push:
    branches: [main]
    paths: ["src/**", "native/**", "plugin/**", "index.html", "package.json", "vite.config.*", ".github/workflows/plugin.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: SY-1-mac
          - os: windows-latest
            name: SY-1-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      # the lockfile was made on Linux: add this platform's native build tools (not saved)
      - name: Platform binaries for vite
        shell: bash
        run: |
          V=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/rolldown/package.json')).version")
          C=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/lightningcss/package.json')).version")
          case "$RUNNER_OS" in
            macOS) P="@rolldown/binding-darwin-arm64@$V lightningcss-darwin-arm64@$C" ;;
            Windows) P="@rolldown/binding-win32-x64-msvc@$V lightningcss-win32-x64-msvc@$C" ;;
          esac
          npm install --no-save $P
          git checkout -- package.json package-lock.json 2>/dev/null || true
      - name: Bundle engine and UI
        shell: bash
        run: bash plugin/prepare.sh

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S plugin -B plugin/build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP\wv2"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S plugin -B plugin/build -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\wv2"
      - name: Build
        run: cmake --build plugin/build --config Release --parallel 4

      - name: Sign (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          A=plugin/build/SY1_artefacts/Release
          for b in "$A/AU/SY-1.component" "$A/VST3/SY-1.vst3" "$A/Standalone/SY-1.app"; do codesign --force --deep -s - "$b"; done
      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          A=plugin/build/SY1_artefacts/Release
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/SY-1.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu Sy1x Avdo
      - name: pluginval (industry plugin test, macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          A=plugin/build/SY1_artefacts/Release
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --timeout-ms 300000 --validate "$A/VST3/SY-1.vst3" 2>&1 | tee pluginval-vst3.txt | tail -60
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --timeout-ms 300000 --validate ~/Library/Audio/Plug-Ins/Components/SY-1.component 2>&1 | tee pluginval-au.txt | tail -30
      - name: Collect
        shell: bash
        run: |
          mkdir out
          A=plugin/build/SY1_artefacts/Release
          cp -R "$A/VST3/SY-1.vst3" out/
          if [ -d "$A/AU" ]; then cp -R "$A/AU/SY-1.component" out/; cp -R "$A/Standalone/SY-1.app" out/; else cp "$A/Standalone/SY-1.exe" out/; fi
      # macOS bundles need their file permissions: pack them with ditto first
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent out SY-1-mac.zip && rm -rf out && mkdir out && mv SY-1-mac.zip out/
      # the latest Mac build also goes to the plugin-builds branch (one commit, replaced each time)
      - name: Publish to plugin-builds branch (macOS)
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
        run: |
          mkdir pb && cp out/SY-1-mac.zip pb/ && cd pb
          git init -q -b plugin-builds && git add SY-1-mac.zip
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "SY-1 Mac build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" plugin-builds
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out
