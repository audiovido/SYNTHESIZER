<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SY-1 Synth</title>
    <meta name="description" content="SY-1 standalone browser subtractive synthesizer built with Web Audio." />
    <meta property="og:title" content="SY-1 Synth" />
    <meta property="og:description" content="SY-1 standalone browser subtractive synthesizer built with Web Audio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#17141f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SY-1" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div class="sy1-shell">
      <div id="sy1-panel"></div>
      <div class="kb-area">
        <div class="kb-bar">
          <button type="button" class="kb-btn" id="oct-down" aria-label="Octave down">Oct −</button>
          <span class="kb-range" id="kb-range"></span>
          <button type="button" class="kb-btn" id="oct-up" aria-label="Octave up">Oct +</button>
          <div class="kb-perf">
            <button type="button" class="kb-btn kb-hold" id="kb-hold" aria-pressed="false" title="Hold: notes keep sounding after you let go">HOLD</button>
            <button type="button" class="kb-btn kb-arp" id="kb-arp" aria-expanded="false" title="Arpeggiator settings">ARP</button>
            <div class="kb-orient-group">
              <button type="button" class="kb-btn kb-oriental" id="kb-oriental" aria-pressed="false" title="Oriental tuning on/off"><span class="kb-oriental-main"><span class="kb-oriental-lbl">ORIENTAL</span></span></button>
              <button type="button" class="kb-btn kb-tune" id="kb-tune" aria-expanded="false" aria-label="Tuning settings" title="Tuning settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="4" x2="5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="19" y1="4" x2="19" y2="20"/><circle cx="5" cy="15" r="2.4" fill="currentColor"/><circle cx="12" cy="8" r="2.4" fill="currentColor"/><circle cx="19" cy="13" r="2.4" fill="currentColor"/></svg></button>
            </div>
          </div>
        </div>
        <div class="kb-main">
          <div class="kb-wheels">
            <div class="kb-wheel" data-wheel="bend" role="slider" aria-label="Pitch bend" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" style="--v:0.5"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">PB</span></div>
            <div class="kb-wheel" data-wheel="mod" role="slider" aria-label="Modulation" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" style="--v:0"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">MOD</span></div>
          </div>
          <div class="kb" id="kb"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
