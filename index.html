<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SY-1 Synth</title>
    <meta name="description" content="SY-1 standalone browser subtractive synthesizer built with Web Audio." />
    <meta property="og:title" content="SY-1 Synth" />
    <meta property="og:description" content="SY-1 standalone browser subtractive synthesizer built with Web Audio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div class="sy1-shell">
      <button type="button" class="sy1-start" id="sy1-start">▶ Tap to start audio</button>
      <div id="sy1-panel"></div>
      <div class="kb-area">
        <div class="kb-bar">
          <button type="button" class="kb-btn" id="oct-down" aria-label="Octave down">Oct −</button>
          <span class="kb-range" id="kb-range"></span>
          <button type="button" class="kb-btn" id="oct-up" aria-label="Octave up">Oct +</button>
          <div class="kb-perf">
            <button type="button" class="kb-btn kb-hold" id="kb-hold" aria-pressed="false" title="Hold: notes keep sounding after you let go">HOLD</button>
            <button type="button" class="kb-btn kb-arp" id="kb-arp" aria-expanded="false" title="Arpeggiator settings">ARP</button>
            <button type="button" class="kb-btn kb-oriental" id="kb-oriental" aria-pressed="false" title="Oriental scale tuning (click to toggle, long-press or ⚙ to edit)"><span class="kb-oriental-main"><span class="kb-oriental-lbl">ORIENTAL</span><small class="kb-oriental-sub" id="kb-oriental-sub">Shur · G</small></span><span class="kb-oriental-gear" data-oriental-gear aria-hidden="true">⚙</span></button>
          </div>
        </div>
        <div class="kb-main">
          <div class="kb-wheels">
            <div class="kb-wheel" data-wheel="bend" role="slider" aria-label="Pitch bend" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" style="--v:0.5"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">PB</span></div>
            <div class="kb-wheel" data-wheel="mod" role="slider" aria-label="Modulation" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" style="--v:0"><span class="kb-wheel-thumb"></span><span class="kb-wheel-label">MOD</span></div>
          </div>
          <div class="kb" id="kb"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
